site_name: IBM Cloud Mastery Path
site_description: A structured, module-wise IBM Cloud training program from entry level to master level, covering IAM, VPC compute and networking, storage, databases, serverless, monitoring, and infrastructure as code.
site_url: https://sigilipelli.github.io/ibm-cloud-mastery-path/
repo_url: https://github.com/SIGILIPELLI/ibm-cloud-mastery-path
repo_name: ibm-cloud-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Setup & the ibmcloud CLI": level-1/01-setup-cli.md
      - "02 · IAM & Security Basics": level-1/02-iam-security.md
      - "03 · Virtual Servers (VPC)": level-1/03-virtual-servers-vpc.md
      - "04 · Cloud Object Storage": level-1/04-cloud-object-storage.md
      - "05 · VPC Networking Basics": level-1/05-vpc-networking.md
      - "06 · Cloud Databases": level-1/06-cloud-databases.md
      - "07 · Cloud Functions": level-1/07-cloud-functions.md
      - "08 · Monitoring & Log Analysis": level-1/08-monitoring-log-analysis.md
      - "09 · Schematics (Terraform IaC)": level-1/09-schematics-iac.md
      - "10 · Capstone Project": level-1/10-capstone-project.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-2/*.md
  level-3/*.md
  level-4/*.md
